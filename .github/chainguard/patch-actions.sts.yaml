# Octo STS trust policy for the ActionChain2 patch-actions deployment (the
# pipeline behind the patch-based control repo, chainguard-dev/guarded-actions2).
# Its distribute publishes the actions the patch pipeline owns: the ones
# chainguard-dev/guarded-actions' policy/ownership.json marks owned, and
# brand-new actions it onboards; prod (prod-actions.sts.yaml) skips those.
#
# Same permissions as prod-actions.sts.yaml. issues: write is for the patch
# deployment's issuegroom, which labels, comments on and closes the new-action
# requests in this repo for the actions the patch pipeline owns.
#
# OCTO_IDENTITY: patch-actions

issuer: https://accounts.google.com

# patch-actions-sa@prod-actions-diei.iam.gserviceaccount.com
subject: "108056040279057031319"

permissions:
  contents: write
  metadata: read
  administration: write
  issues: write
  workflows: write

repositories: [] # Act over all of the repos in the org.
